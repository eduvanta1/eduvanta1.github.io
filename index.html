<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050313"><title>Loading | EDUVANTA SCHOLARS"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#14275b 0%,#090a2a 35%,#03020d 78%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";background-image:radial-gradient(2px 2px at 8% 20%,#fff,transparent),radial-gradient(1px 1px at 23% 70%,#c6aaff,transparent),radial-gradient(2px 2px at 70% 15%,#fff,transparent),radial-gradient(1px 1px at 86% 60%,#83caff,transparent),radial-gradient(1px 1px at 48% 42%,#fff,transparent),radial-gradient(2px 2px at 62% 83%,#c28bff,transparent);background-size:360px 280px;animation:drift 24s linear infinite}.stars:before{transform:scale(1.4);opacity:.55;animation-duration:34s}.stars:after{transform:scale(.8);opacity:.7;animation-duration:18s}@keyframes drift{to{transform:translateY(-45px)}}.planet{position:absolute;width:min(88vw,760px);aspect-ratio:1;border-radius:50%;top:4%;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 50% 45%,#07102a 0 45%,#102a67 58%,#0a1a45 66%,#2a9bff 68%,#1232a0 70%,transparent 72%);box-shadow:0 0 35px #168bff,0 0 100px #4a2aff66;opacity:.9}.planet:after{content:"";position:absolute;inset:7%;border-radius:50%;background:radial-gradient(ellipse at 50% 0%,#75d7ff55,transparent 42%);filter:blur(12px)}.wrap{position:relative;z-index:2;width:min(560px,90vw);text-align:center;margin-top:26vh}.brand{font-size:clamp(13px,2vw,18px);letter-spacing:.36em;font-weight:800;color:#e8dcff}.brand b{display:block;font-size:clamp(36px,7vw,66px);letter-spacing:-.04em;background:linear-gradient(90deg,#fff,#dcaaff,#63b9ff);-webkit-background-clip:text;color:transparent;margin:12px 0 4px}.tag{font-size:11px;letter-spacing:.42em;color:#d4c9f7;margin-bottom:32px}.bar{height:17px;border:1px solid #bd45ff;border-radius:99px;padding:2px;background:#07031b;box-shadow:0 0 18px #9c35ff88,0 0 40px #4e39ff44;overflow:hidden}.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a20dff,#d74cff,#14c9ff);box-shadow:0 0 14px #c63cff;transition:width .08s linear}.percent{font-size:15px;font-weight:800;letter-spacing:.12em;margin-top:13px;color:#fff}.loading{font-size:12px;letter-spacing:.15em;color:#c8c1e6;margin-top:9px}@media(max-height:650px){.planet{width:75vh;top:-12%}.wrap{margin-top:24vh}}
</style></head><body><div class="stars"></div><div class="planet"></div><main class="wrap"><div class="brand">THE<b>EDUVANTA</b>SCHOLARS</div><div class="tag">LEARN · GROW · ACHIEVE</div><div class="bar"><div class="fill" id="fill"></div></div><div class="percent" id="percent">0%</div><div class="loading">PREPARING YOUR LEARNING JOURNEY…</div></main>
<script>(()=>{const fill=document.getElementById('fill'),label=document.getElementById('percent');let value=0;const duration=3600,start=performance.now();function tick(now){value=Math.min(100,Math.floor((now-start)/duration*100));fill.style.width=value+'%';label.textContent=value+'%';if(value<100)requestAnimationFrame(tick);else setTimeout(()=>location.replace('../interface/'),350)}requestAnimationFrame(tick)})();</script></body></html>
