<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08051a">
  <title>EDUVANTA SCHOLARS | Welcome</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #08051a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .scene {
      min-height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 40px 8%;
      background:
        linear-gradient(
          90deg,
          rgba(3,2,17,.92) 0%,
          rgba(4,2,20,.76) 42%,
          rgba(4,2,20,.08) 100%
        ),
        url('../assets/interface-bg.png') center/cover no-repeat;
    }

    .content {
      width: 100%;
      max-width: 650px;
      position: relative;
      z-index: 2;
      animation: fadeIn 1.2s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 55px;
      color: white;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3px;
      line-height: 1.5;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 50%;
      display: block;
      filter: drop-shadow(0 0 12px rgba(194,106,255,.65));
    }

    .welcome {
      color: #d6a7ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -2px;
      text-shadow: 0 5px 30px rgba(0,0,0,.5);
    }

    h1 span {
      display: block;
      color: #d6a0ff;
      text-shadow: 0 0 25px rgba(174,76,255,.45);
    }

    .tagline {
      color: #d7d2e8;
      font-size: clamp(15px, 2vw, 19px);
      margin-top: 22px;
      letter-spacing: 1px;
    }

    .start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 42px;
      padding: 17px 30px;
      min-width: 205px;
      border-radius: 50px;
      color: #160b27;
      background: linear-gradient(110deg, #f0c8ff, #bd70ff, #e2b5ff);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(183,91,255,.45);
      transition: .3s ease;
    }

    .start:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 38px rgba(183,91,255,.75);
    }

    .arrow {
      font-size: 22px;
      transition: .3s;
    }

    .start:hover .arrow {
      transform: translateX(5px);
    }

    .bottom-text {
      margin-top: 65px;
      color: rgba(220,210,240,.55);
      font-size: 11px;
      letter-spacing: 3px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .scene {
        padding: 30px 7%;
        background:
          linear-gradient(
            90deg,
            rgba(3,2,17,.88),
            rgba(4,2,20,.58)
          ),
          url('../assets/interface-bg.png') center/cover no-repeat;
      }

      .brand {
        margin-bottom: 65px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .bottom-text {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <section class="content">

      <div class="brand">
        <img
          src="../assets/eduvanta-logo.png"
          alt="EDUVANTA SCHOLARS"
          class="brand-mark"
        >
        <span>EDUVANTA<br>SCHOLARS</span>
      </div>

      <p class="welcome">WELCOME TO</p>

      <h1>
        EDUVANTA
        <span>SCHOLARS</span>
      </h1>

      <p class="tagline">
        Smart Study. Bright Future.
      </p>

      <a class="start" href="../study/">
        Start Learning
        <span class="arrow">→</span>
      </a>

      <p class="bottom-text">
        LEARN • GROW • ACHIEVE
      </p>

    </section>
  </main>
</body>
</html>
